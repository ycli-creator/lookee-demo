<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主题聊</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="button.css">
  <script src="app.js" defer></script>
</head>
<body>
<main class="phone" aria-labelledby="title">
  <div class="sticky-header">
    <img class="decoration" src="assets/9465f.svg" alt="">
    <div class="status" aria-hidden="true">
      <strong>9:41</strong><i class="island"></i>
      <span class="levels"><span class="signal"><i></i><i></i><i></i><i></i></span><img src="assets/f9177.svg" alt=""><img src="assets/f0759.svg" alt=""></span>
    </div>
    <header class="navigation">
      <button class="app-button app-button--structural" id="back" aria-label="返回"><span class="app-icon app-icon--back" aria-hidden="true"></span></button>
      <h1 id="title">主题聊</h1>
      <button class="app-button app-button--structural" id="search-toggle" aria-label="打开资源搜索" aria-haspopup="dialog" aria-controls="search-screen" inert><img src="assets/cefb6.svg" alt=""></button>
      <button class="app-button app-button--structural" id="help" aria-label="帮助"><span class="app-icon app-icon--help" aria-hidden="true"></span></button>
    </header>
  </div>
  <div class="compact-dock">
    <aside class="compact-config" id="compact-config" aria-label="当前主题聊配置" inert>
      <div class="compact-card">
        <img id="compact-cover" src="assets/5b808.png" alt="">
        <p id="compact-title">森林里的朋友</p>
        <button class="app-button" id="compact-add">添加内容</button>
      </div>
    </aside>
  </div>
  <section class="load-error" id="load-error" hidden>
    <span class="mascot mascot--error" aria-hidden="true"><img src="assets/e6069.png" alt=""></span>
    <p>加载失败，可以刷新重试喔~</p>
    <button class="app-button app-button--strong" id="retry">重新加载<img src="assets/50292.svg" alt=""></button>
  </section>
  <div class="hero">
    <button class="app-button app-button--structural search search-trigger" id="search-trigger" aria-haspopup="dialog" aria-controls="search-screen"><img src="assets/2f26f.svg" alt=""><span>搜索绘本、故事、思维导图等</span></button>
    <section class="configuration" aria-label="当前主题聊配置">
      <div class="config-heading"><h2>当前主题聊配置：</h2><button class="app-button app-button--structural" id="adjust">调整聊天配置<img src="assets/587a2.svg" alt=""></button></div>
      <div class="config-card">
        <div class="summary">
          <img id="cover" src="assets/5b808.png" alt="">
          <div class="summary-text">
            <h3 id="current-title">森林里的朋友</h3>
            <div class="tags"><span>一年级</span><span>睡前故事</span><span>20min</span></div>
            <div class="prompts"><p id="prompt1">提示词1：使用该组图片生成7岁小朋友的睡前故事，时长20分钟</p><p id="prompt2">提示词2：我希望内容非常的和谐友善，故事要充满友情、温度，并且不需要太激昂的音色</p></div>
          </div>
        </div>
        <div class="empty-config" id="empty-config" hidden>
          <span class="mascot mascot--happy" aria-hidden="true"><img src="assets/e6069.png" alt=""></span>
          <img class="bubble-dot" src="assets/b921c.svg" alt="">
          <p>暂时还没有添加内容哦，快去上传你的第一个素材吧~<br>想了解更多可以点击右上方帮助哦</p>
        </div>
        <button class="app-button app-button--hero app-button--block" id="add">添加内容</button>
        <button class="app-button app-button--structural resource-link" id="resource-link">我的资源 - 森林里的朋友</button>
      </div>
    </section>
  </div>
  <section class="library" aria-label="资源库">
    <div class="library-toolbar">
    <div class="tabs" role="tablist" aria-label="资源来源">
      <button class="app-button app-button--structural" role="tab" id="shared-tab" aria-controls="resources" aria-selected="false" tabindex="-1">共享资源</button>
      <button class="app-button app-button--structural" role="tab" id="mine-tab" aria-controls="resources" aria-selected="true">我的资源</button>
    </div>
      <div class="actions">
        <button class="app-button app-button--neutral" id="create">新建<span class="app-icon app-icon--create" aria-hidden="true"></span></button>
        <button class="app-button app-button--neutral" id="upload">上传<span class="app-icon app-icon--upload" aria-hidden="true"></span></button>
        <button class="app-button app-button--neutral" id="manage" aria-haspopup="dialog">管理<span class="app-icon app-icon--manage" aria-hidden="true"></span></button>
        <input type="file" id="files" accept="image/*,application/pdf" multiple hidden>
      </div>
      <div class="tools"><button class="app-button app-button--structural" id="sort">按名称排序<img src="assets/1948a.svg" alt=""></button><span>仅支持图片、PDF类型的文件展示</span></div>
    </div>
    <div id="resources" class="resource-scroll" role="tabpanel" aria-labelledby="mine-tab" tabindex="0">
      <div class="grid" id="grid"></div>
      <p id="empty" hidden>没有找到资源</p>
      <div class="empty-library" id="empty-library" hidden>
        <span class="mascot mascot--kiss" aria-hidden="true"><img src="assets/e6069.png" alt=""></span>
        <button class="app-button" id="empty-upload">上传资源</button>
      </div>
    </div>
  </section>
  <div class="collapse-space" aria-hidden="true"></div>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<dialog class="search-screen" id="search-screen" aria-label="搜索资源">
  <img class="decoration" src="assets/9465f.svg" alt="">
  <div class="status" aria-hidden="true">
    <strong>9:41</strong><i class="island"></i>
    <span class="levels"><span class="signal"><i></i><i></i><i></i><i></i></span><img src="assets/f9177.svg" alt=""><img src="assets/f0759.svg" alt=""></span>
  </div>
  <form class="search-nav" id="search-form" role="search">
    <button class="app-button app-button--structural" id="search-back" type="button" aria-label="返回"><img src="assets/78aa3.svg" alt=""></button>
    <label class="search"><img src="assets/2f26f.svg" alt=""><input id="resource-search" type="text" role="searchbox" inputmode="search" enterkeyhint="search" aria-label="搜索资源" placeholder="搜索绘本、故事、思维导图等" autofocus></label>
  </form>
  <section class="search-results" aria-label="搜索结果">
    <div class="grid" id="search-results"></div>
    <p id="search-empty" hidden>没有找到资源</p>
    <p id="search-feedback" role="status"></p>
  </section>
  <section class="search-keyboard" id="search-keyboard" aria-label="屏幕键盘">
    <div id="keyboard-rows"></div>
    <div class="keyboard-toolbar">
      <button class="app-button app-button--structural" id="keyboard-emoji" type="button" aria-label="切换表情键盘"><img src="assets/0492e.svg" alt=""></button>
      <button class="app-button app-button--structural" id="keyboard-mic" type="button" aria-label="语音搜索"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></svg></button>
    </div>
  </section>
</dialog>
<dialog class="picker" id="picker" aria-labelledby="picker-count">
  <header class="picker-header">
    <h2 id="picker-count" aria-live="polite">已选择 0 张图片</h2>
    <form method="dialog"><button class="app-button app-button--neutral">取消</button></form>
  </header>
  <div class="picker-scroll"><div class="grid" id="picker-grid"></div></div>
  <footer class="picker-actions">
    <button class="app-button picker-tool" id="picker-delete" aria-label="删除已选内容"><img src="assets/374f9.svg" alt=""></button>
    <button class="app-button picker-tool" id="picker-share" aria-label="分享已选内容"><img src="assets/76762.svg" alt=""></button>
    <button class="app-button app-button--strong" id="picker-add">加入当前主题聊</button>
  </footer>
  <div class="picker-success" id="picker-success" role="status" hidden>
    <img src="assets/1da68.svg" alt=""><strong>添加成功</strong>
  </div>
</dialog>
<dialog id="dialog" aria-labelledby="dialog-title">
  <form method="dialog" id="dialog-form">
    <h2 id="dialog-title"></h2>
    <div id="dialog-content"></div>
    <div class="dialog-actions"><button class="app-button app-button--neutral" value="cancel" formnovalidate>关闭</button><button class="app-button" id="confirm" value="confirm">确认</button></div>
  </form>
</dialog>
<dialog class="preview" id="preview" aria-labelledby="preview-title">
  <div class="status preview-status" aria-hidden="true">
    <strong>9:41</strong><span></span>
    <span class="levels"><span class="signal"><i></i><i></i><i></i><i></i></span><img src="assets/7e1aa.svg" alt=""><img src="assets/e743a.svg" alt=""></span>
  </div>
  <header class="preview-header">
    <form method="dialog"><button class="app-button app-button--structural" aria-label="返回素材列表" autofocus><img src="assets/78a3e.svg" alt=""></button></form>
    <h2 id="preview-title"></h2>
    <button class="app-button app-button--structural" id="preview-share" aria-label="分享素材"><img src="assets/a6647.svg" alt=""></button>
  </header>
  <div class="preview-stage" id="preview-stage"></div>
  <footer class="preview-footer">
    <div class="preview-pagination" id="preview-pagination" role="group" aria-label="选择图片" hidden></div>
    <button class="app-button app-button--preview-action" id="preview-select">设为主题聊</button>
  </footer>
  <p class="preview-feedback" id="preview-feedback" role="status"></p>
</dialog>
</body>
</html>
